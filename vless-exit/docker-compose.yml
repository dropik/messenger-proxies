services:
  vless-exit:
    image: teddysun/xray:26.10.31   # pinned: upgrade relay and exit together
    container_name: vless-exit
    restart: unless-stopped
    ports:
      # Reached only through the CDNs; firewall/ restricts both ports to CDN ranges.
      - "8443:8443/tcp"   # Cloudflare and CloudFront (xhttp)
      - "8444:8444/tcp"   # CloudFront WebSocket fallback (second origin + path behavior)
    volumes:
      - ./config.json:/etc/xray/config.json:ro
      - ./certs:/etc/xray/certs:ro
    environment:
      - TZ=UTC
    networks:
      default:
      monitoring:                   # created by monitoring/exit; drop this if you don't run it
        ipv4_address: 10.213.0.20   # Xray's metrics endpoint listens here

networks:
  monitoring:
    external: true

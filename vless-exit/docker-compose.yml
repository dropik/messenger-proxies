services:
  vless-exit:
    image: teddysun/xray:26.10.31   # pinned: upgrade relay and exit together
    container_name: vless-exit
    restart: unless-stopped
    ports:
      # Reached only through the CDN; firewall/ restricts it to CDN ranges.
      - "8443:8443/tcp"   # Cloudflare (xhttp)
      - "8444:8444/tcp"   # CloudFront (WebSocket); drop if you only use one CDN
    volumes:
      - ./config.json:/etc/xray/config.json:ro
      - ./certs:/etc/xray/certs:ro
    environment:
      - TZ=UTC

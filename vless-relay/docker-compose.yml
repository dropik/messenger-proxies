# Docker keeps container logs forever by default: 3 x 20 MB per container.
x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "3" }

services:
  vless-relay:
    image: teddysun/xray:26.10.31   # pinned: upgrade relay and exit together
    container_name: vless-relay
    restart: unless-stopped
    logging: *logging
    ports:
      - "443:443/tcp"
      # monitoring (monitoring/relay): localhost only
      - "127.0.0.1:10809:10809/tcp"   # monitor-in: vmagent pushes metrics through the tunnel
      - "127.0.0.1:11111:11111/tcp"   # Xray metrics endpoint
    volumes:
      - ./config.json:/etc/xray/config.json:ro
    extra_hosts:
      # Pin the CDN hostname so the relay never looks it up over plain DNS.
      - "${CDN_HOSTNAME}:${CDN_IP_1}"
      - "${CDN_HOSTNAME}:${CDN_IP_2}"
    environment:
      - TZ=UTC
    # The container has its own network namespace, which does not inherit these from the
    # host. BBR recovers faster from loss than cubic; without slow start after idle, a pooled
    # connection keeps its speed between bursts. BBR needs the host module: see README.
    sysctls:
      - net.ipv4.tcp_congestion_control=bbr
      - net.ipv4.tcp_slow_start_after_idle=0
    depends_on:
      - decoy

  # Local REALITY "dest". REALITY contacts dest on every connection, so a real
  # third-party site would eventually block the relay's IP.
  decoy:
    image: nginx:alpine
    container_name: vless-decoy
    restart: unless-stopped
    logging: *logging
    volumes:
      - ./decoy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./decoy:/etc/nginx/decoy:ro

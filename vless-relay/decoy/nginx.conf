events {}

http {
    access_log off;
    server_tokens off;

    server {
        # REALITY copies this server's TLS 1.3 handshake shape: keep TLS 1.3 + X25519.
        listen 8443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/decoy/cert.pem;
        ssl_certificate_key /etc/nginx/decoy/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ecdh_curve X25519:prime256v1;

        root /usr/share/nginx/html;
        location / { index index.html; }
    }
}

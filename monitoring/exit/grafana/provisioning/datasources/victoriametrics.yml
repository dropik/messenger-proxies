apiVersion: 1
# Recreated on every start so its uid stays "vm" (dashboards refer to it by uid; Grafana
# refuses to change the uid of an existing provisioned datasource in place).
deleteDatasources:
  - name: VictoriaMetrics
    orgId: 1
datasources:
  - name: VictoriaMetrics
    uid: vm
    type: prometheus
    access: proxy
    url: http://10.213.0.10:8428
    isDefault: true
    editable: false

groups:
  - name: relay
    rules:
      # For the users' channel (audience=users), not for the owner: one plain "VPN is down"
      # when a real client can't get through (either group's probe fails) or the relay is
      # unreachable. `for` and keep_firing_for keep blips and flapping out of the channel.
      - alert: VpnOutage
        expr: |
          (min(max_over_time(probe_success{host="relay", target="generate_204"}[3m])) == 0)
          or on() (count(absent_over_time(up{job="node", host="relay"}[5m])) > 0)
        for: 7m
        keep_firing_for: 5m
        labels: { severity: critical, audience: users }
        annotations: { summary: "VPN outage (users' channel)" }

      # vmagent pushes through the tunnel; if nothing arrives, either the relay or every
      # path behind it is down. (vmagent buffers and resends once the path is back.)
      - alert: RelayDataMissing
        expr: absent_over_time(up{job="node", host="relay"}[5m])
        labels: { severity: critical }
        annotations: { summary: "Relay: no metrics for 5 minutes (relay down or all tunnel paths down)" }

      - alert: ProbeForwardFailing
        expr: max_over_time(probe_success{group="forward", target="generate_204"}[3m]) == 0
        labels: { severity: critical }
        annotations: { summary: "Relay probe: forward group cannot fetch a test page for 3+ minutes" }

      - alert: ProbeDirectFailing
        expr: max_over_time(probe_success{group="direct", target="generate_204"}[3m]) == 0
        labels: { severity: critical }
        annotations: { summary: "Relay probe: direct group cannot fetch a test page for 3+ minutes" }

      - alert: ProbeTargetFailing
        expr: max_over_time(probe_success[15m]) == 0
        labels: { severity: warning }
        annotations: { summary: "Relay probe: {{ $labels.group }} -> {{ $labels.target }} failing for 15 minutes" }

      - alert: ProbeStale
        expr: time() - probe_last_run_timestamp_seconds > 300
        labels: { severity: warning }
        annotations: { summary: "Relay probe has not run for 5+ minutes" }

      - alert: ProbeSlow
        expr: max_over_time(probe_download_bytes_per_second{group="forward"}[45m]) < 1000000
        labels: { severity: warning }
        annotations: { summary: "Relay probe: forward download under 1 MB/s for 45 minutes (throttling?)" }

      - alert: AllExitPathsDown
        expr: max(xray_observatory_alive{host="relay", tag=~"exit-.*"}) == 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "Relay: Cloudflare and the CloudFront fallback both failing health checks" }

      - alert: CloudflarePathDown
        expr: max(xray_observatory_alive{host="relay", tag=~"exit-cdn.*"}) == 0
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Relay: Cloudflare path down for 5+ minutes, users are on the fallback" }

      # exit-cdn dials the zone's first IP, exit-cdn-2 the second; the balancer uses whichever works.
      - alert: CloudflareAddressDown
        expr: min(xray_observatory_alive{host="relay", tag=~"exit-cdn.*"}) == 0 and max(xray_observatory_alive{host="relay", tag=~"exit-cdn.*"}) == 1
        for: 30m
        labels: { severity: warning }
        annotations: { summary: "Relay: one of Cloudflare's two addresses failing health checks for 30+ minutes" }

      # Connections to Cloudflare stuck with unacknowledged data (see the TCP panels).
      - alert: CloudflareConnectionsStuck
        expr: sum(tcp_peer_stuck_conns{host="relay", name=~"cloudflare-.*"}) > 0
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Relay: connections to Cloudflare keep getting stuck (10+ minutes)" }

      - alert: FallbackPathDown
        expr: xray_observatory_alive{host="relay", tag="exit-cfws"} == 0
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Relay: CloudFront WebSocket fallback failing for 15+ minutes (no failover if Cloudflare goes)" }

      - alert: SplitPathDown
        expr: max(xray_observatory_alive{host="relay", tag=~"yt-split-.*"}) == 0
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Relay: CloudFront download legs failing for 15+ minutes (YouTube all on Cloudflare)" }

      # The classifier's labels are shown on dashboards only (see PHASE1.md) until checked
      # against real phones; only its own health alerts.
      - alert: ClassifierStale
        expr: time() - classifier_last_update_timestamp_seconds > 180
        for: 2m
        labels: { severity: warning }
        annotations: { summary: "Relay: disconnect classifier not updating (bpftrace or service down)" }

      - alert: ConntrackHigh
        expr: node_nf_conntrack_entries / node_nf_conntrack_entries_limit > 0.8
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "{{ $labels.host }}: connection tracking table over 80%" }

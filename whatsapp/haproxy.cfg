# WhatsApp Proxy HAProxy Configuration
# Configure this proxy in WhatsApp app settings

global
    log stdout format raw local0
    maxconn 27500
    spread-checks 5
    ssl-server-verify none

# DNS resolvers for dynamic hostname resolution
resolvers dns_servers
    nameserver dns1 8.8.8.8:53
    nameserver dns2 8.8.4.4:53
    nameserver dns3 1.1.1.1:53
    accepted_payload_size 8192
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 30s
    hold nx 30s
    hold refused 30s

defaults
    mode tcp
    timeout client-fin 1s
    timeout server-fin 1s
    timeout connect 5s
    timeout client 200s
    timeout server 200s
    default-server inter 10s fastinter 1s downinter 3s error-limit 50

# =============================================================================
# FRONTENDS
# =============================================================================

frontend fe_http
    bind *:80
    default_backend be_whatsapp_http

frontend fe_https
    bind *:443 ssl crt /etc/haproxy/certs/proxy.pem
    default_backend be_whatsapp_chat

frontend fe_xmpp
    bind *:5222
    default_backend be_whatsapp_chat

frontend fe_http_alt
    bind *:8080
    default_backend be_whatsapp_http

frontend fe_https_alt
    bind *:8443 ssl crt /etc/haproxy/certs/proxy.pem
    default_backend be_whatsapp_chat

frontend fe_media
    bind *:587
    bind *:7777
    default_backend be_whatsapp_media

# =============================================================================
# BACKENDS
# =============================================================================

backend be_whatsapp_http
    default-server resolvers dns_servers init-addr last,libc,none check inter 60000 observe layer4 send-proxy
    server g_whatsapp_net_80 g.whatsapp.net:80

backend be_whatsapp_chat
    default-server resolvers dns_servers init-addr last,libc,none check inter 60000 observe layer4 send-proxy
    server g_whatsapp_net_5222 g.whatsapp.net:5222

backend be_whatsapp_media
    default-server resolvers dns_servers init-addr last,libc,none check inter 60000 observe layer4
    server whatsapp_net_443 whatsapp.net:443

# =============================================================================
# STATISTICS
# =============================================================================

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats show-legends
    stats refresh 10s
